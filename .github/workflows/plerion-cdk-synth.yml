name: "Plerion  Upload IaC artifact"

on:
  pull_request:

jobs:
  synth-and-upload:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install deps
        run: |
          cd cdk
          npm ci

      - name: CDK synth
        run: |
          cd cdk
          npx cdk synth --quiet --output cdk.out

      - name: Prepare IaC artifacts
        run: |
          cd cdk
          mkdir -p templates
          find cdk.out -type f -name '*.template.json' -exec cp {} templates/ \;
          echo '{"schema":"plerion-iac-manifest/v1","generator":"cdk"}' > plerion-manifest.json

      - name: Upload artifacts for Plerion
        uses: actions/upload-artifact@v4
        with:
          name: cdk-iac-templates
          path: |
            cdk/templates/*.template.json
            cdk/plerion-manifest.json
          if-no-files-found: error
          retention-days: 3
